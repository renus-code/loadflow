              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Truck not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Version or unique conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags: [Trucks]
      summary: Delete a truck
      description: Admin only
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: Truck deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Truck not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/trailers:
    get:
      tags: [Trailers]
      summary: Get trailers
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Trailer list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Trailer'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags: [Trailers]
      summary: Create a trailer
      description: Admin only
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTrailerRequest'
      responses:
        '201':
          description: Trailer created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trailer'
        '400':
          description: Missing required fields
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Unique field conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/trailers/{id}:
    put:
      tags: [Trailers]
      summary: Update a trailer
      description: Admin only
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/IdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/CreateTrailerRequest'
                - type: object
                  properties:
                    __v:
                      type: integer
      responses:
        '200':
          description: Trailer updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trailer'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Trailer not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Version or unique conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags: [Trailers]
      summary: Delete a trailer
      description: Admin only
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: Trailer deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Trailer not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: token

  parameters:
    IdParam:
      in: path
      name: id
      required: true
      schema:
        type: string
      description: MongoDB document id

  schemas:
    MessageResponse:
      type: object
      properties:
        message:
          type: string

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required: [error]

    Pagination:
      type: object
      properties:
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer
        pages:
          type: integer

    Notification:
      type: object
      properties:
        _id:
          type: string
        userId:
          type: string
          nullable: true
        targetRole:
          type: string
          enum: [Admin, Dispatcher, Driver]
          nullable: true
        message:
          type: string
        type:
          type: string
          enum: [INFO, WARNING, DANGER, SUCCESS]

        link:
          type: string
          nullable: true
        isRead:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    AuditLog:
      type: object
      properties:
        _id:
          type: string
        userId:
          oneOf:
            - type: string
              description: User ID as a string
            - type: object
              properties:
                _id:
                  type: string
                name:
                  type: string
                email:
                  type: string
                  format: email
                role:
                  type: string
                  enum: [Admin, Dispatcher, Driver]
          nullable: true
        action:
          type: string
        entityType:
          type: string
          nullable: true
        entityId:
          type: string
          nullable: true
        details:
          type: object
          additionalProperties: true
          nullable: true
        ipAddress:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time

    User:
      type: object
      properties:
        _id:
          type: string
        id:
          type: string
        name:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
          enum: [Admin, Dispatcher, Driver]
        isPending:
          type: boolean
        phone:
          type: string
          nullable: true
        licenseNumber:
          type: string
          nullable: true
        dob:
          type: string
          format: date-time
          nullable: true
        city:
          type: string
          nullable: true
        province:
          type: string
          nullable: true
        postalCode:
          type: string
          nullable: true
        address:
          type: string
          nullable: true
        resetPasswordRequested:
          type: boolean
        resetPasswordApproved:
          type: boolean
        loginAttempts:
          type: integer
        isLocked:
          type: boolean
        lockedUntil:
          type: string
          format: date-time
          nullable: true
        tokenVersion:
          type: integer
          description: Session revocation index
        isTwoFactorEnabled:
          type: boolean
          description: Whether the user has setup 2FA
        requestedBy:
          type: string
          nullable: true
          description: Dispatcher ID for recruitment flow reference
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        __v:
          type: integer

    CheckEmailResponse:
      type: object
      properties:
        role:
          type: string
          enum: [Driver, Dispatcher]
        isPending:
          type: boolean
        name:
          type: string

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    LoginSuccessResponse:
      type: object
      properties:
        message:
          type: string
        user:
          type: object
          properties:
            id:
              type: string
            name:
              type: string
            role:
              type: string
              enum: [Admin, Dispatcher, Driver]

    LockedAccountResponse:
      type: object
      properties:
        error:
          type: string
        locked:
          type: boolean
        message:
          type: string

    PublicRegisterRequest:
      type: object
      required: [name, email, password, role]
      properties:
        name:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
        role:
          type: string
          enum: [Driver, Dispatcher]
        phone:
          type: string
        licenseNumber:
          type: string
        dob:
          type: string
          format: date
        city:
          type: string
        province:
          type: string
        postalCode:
          type: string
        address:
          type: string

    AdminInviteRequest:
      type: object
      required: [email]
      properties:
        name:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          description: Optional starter password. If omitted, invitation stays pending.
        role:
          type: string
          enum: [Admin, Dispatcher, Driver]

    ResetPasswordRequest:
      type: object
      required: [email, password, confirmPassword]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
        confirmPassword:
          type: string

    ProfileUpdateRequest:
      type: object
      properties:
        name:
          type: string
        phone:
          type: string
        address:
          type: string
        city:
          type: string
        province:
          type: string
        postalCode:
          type: string
        licenseNumber:
          type: string
        currentPassword:
          type: string
        newPassword:
          type: string

    UserUpdateRequest:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
          enum: [Admin, Dispatcher, Driver]
        isPending:
          type: boolean
        phone:
          type: string
        licenseNumber:
          type: string
        city:
          type: string
        province:
          type: string
        postalCode:
          type: string
        address:
          type: string
        resetPasswordRequested:
          type: boolean
        resetPasswordApproved:
          type: boolean
        loginAttempts:
          type: integer
        isLocked:
          type: boolean
        __v:
          type: integer

    Stop:
      type: object
      required:
        - address
        - city
        - state
        - postalCode
        - appointmentNumber
        - date
        - time
      properties:
        address:
          type: string
        city:
          type: string
        state:
          type: string
        postalCode:
          type: string
        appointmentNumber:
          type: string
        date:
          type: string
          format: date-time
        time:
          type: string
        status:
          type: string
          enum: [PENDING, PICKED_UP, DELIVERED]
        lat:
          type: number
          nullable: true
        lng:
          type: number
          nullable: true

    CreateLoadRequest:
      type: object
      required:
        - loadNumber
        - pickups
        - deliveries
        - quantity
        - quantityUnit
        - weight
        - weightUnit
      properties:
        loadNumber:
          type: string
        pickups:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/Stop'
        deliveries:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/Stop'
        quantity:
          type: number
        quantityUnit:
          type: string
          enum: [skids, pallets, packages, pieces, box, cases]
        weight:
          type: number
        weightUnit:
          type: string
          enum: [lbs, kg]
        totalDistance:
          type: number
          nullable: true
          description: In miles (mock feature)
        estimatedDuration:
          type: number
          nullable: true
          description: In hours (mock feature)


    AssignLoadRequest:
      type: object
      required: [assignedDriverId, truckNumber, trailerNumber]
      properties:
        assignedDriverId:
          type: string
        truckNumber:
          type: string
        trailerNumber:
          type: string
        truckType:
          type: string
          enum: [Sleeper Cab, Day Cab]
        trailerType:
          type: string
          enum: [Dry Van, Reefer, Tri Axle, Flatbed]
        __v:
          type: integer

    LoadStatusPatchRequest:
      type: object
      properties:
        status:
          type: string
          enum: [PENDING, IN_TRANSIT, PICKED_UP, DELIVERED, CANCELLED, COMPLETED]
        stopType:
          type: string
          enum: [pickups, deliveries]
        stopIndex:
          type: integer
        stopStatus:
          type: string
          enum: [PENDING, PICKED_UP, DELIVERED]
        assignedDriverId:
          type: string
          nullable: true
        truckNumber:
          type: string
          nullable: true
        trailerNumber:
          type: string
          nullable: true
        truckType:
          type: string
          enum: [Sleeper Cab, Day Cab]
          nullable: true
        trailerType:
          type: string
          enum: [Dry Van, Reefer, Tri Axle, Flatbed]
          nullable: true
        __v:
          type: integer

    Load:
      type: object
      properties:
        _id:
          type: string
        loadNumber:
          type: string
        pickups:
          type: array
          items:
            $ref: '#/components/schemas/Stop'
        deliveries:
          type: array
          items:
            $ref: '#/components/schemas/Stop'
        quantity:
          type: number
        quantityUnit:
          type: string
          enum: [skids, pallets, packages, pieces, box, cases]
        weight:
          type: number
        weightUnit:
          type: string
          enum: [lbs, kg]
        truckType:
          type: string
          enum: [Sleeper Cab, Day Cab]
          nullable: true
        trailerType:
          type: string
          enum: [Dry Van, Reefer, Tri Axle, Flatbed]
          nullable: true
        trailerNumber:
          type: string
          nullable: true
        truckNumber:
          type: string
          nullable: true
        assignedDriverId:
          oneOf:
            - type: string
            - type: object
              properties:
                _id:
                  type: string
                name:
                  type: string
                email:
                  type: string
                  format: email
          nullable: true
        createdBy:
          oneOf:
            - type: string
            - type: object
              properties:
                _id:
                  type: string
                name:
                  type: string
                email:
                  type: string
                  format: email
        status:
          type: string
          enum: [PENDING, IN_TRANSIT, PICKED_UP, DELIVERED, CANCELLED, COMPLETED]
        podUrl:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        totalDistance:
          type: number
          nullable: true
          description: In miles (mock feature)
        estimatedDuration:
          type: number
          nullable: true
          description: In hours (mock feature)

        __v:
          type: integer

    Pod:
      type: object
      properties:
        _id:
          type: string
        loadId:
          oneOf:
            - type: string
            - $ref: '#/components/schemas/Load'
        imageUrl:
          type: string
        uploadedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateTruckRequest:
      type: object
      required: [truckNo, vin, plate, year, make, model, truckType]
      properties:
        truckNo:
          type: string
        vin:
          type: string
        plate:
          type: string
        year:
          type: integer
        make:
          type: string
        model:
          type: string
        truckType:
          type: string
          enum: [Sleeper Cab, Day Cab]

    Truck:
      type: object
      properties:
        _id:
          type: string
        truckNo:
          type: string
        vin:
          type: string
        plate:
          type: string
        year:
          type: integer
        make:
          type: string
        model:
          type: string
        truckType:
          type: string
          enum: [Sleeper Cab, Day Cab]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        __v:
          type: integer

    CreateTrailerRequest:
      type: object
      required: [trailerNo, vin, plate, year, make, model, trailerType]
      properties:
        trailerNo:
          type: string
        vin:
          type: string
        plate:
          type: string
        year:
          type: integer
        make:
          type: string
        model:
          type: string
        trailerType:
          type: string
          enum: [Dry Van, Reefer, Tri Axle, Flatbed]

    Trailer:
      type: object
      properties:
        _id:
          type: string
        trailerNo:
          type: string
        vin:
          type: string
        plate:
          type: string
        year:
          type: integer
        make:
          type: string
        model:
          type: string
        trailerType:
          type: string
          enum: [Dry Van, Reefer, Tri Axle, Flatbed]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        __v:
          type: integer
